<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地铁跑酷 · Dream还我十万美刀</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: "Microsoft YaHei", sans-serif; }
        #gameCanvas { display: block; }
        #scoreUI {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 32px; font-weight: bold; text-shadow: 0 0 8px #000;
        }
        #tip {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 16px; text-shadow: 0 0 6px #000;
        }
        #dialog {
            position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%);
            width: 880px; background: rgba(0,0,0,0.92); color: #fff;
            padding: 18px 24px; border-radius: 10px; font-size: 20px;
            text-align: center; display: none;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); padding: 50px; border-radius: 15px;
            color: #fff; text-align: center; display: none;
        }
        #restart {
            margin-top: 25px; padding: 12px 32px; font-size: 18px;
            background: #0099ff; color: #fff; border: none; border-radius: 8px; cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="scoreUI">分数：<span id="score">0</span></div>
    <div id="tip">A/D 换道 | 空格跳跃 | Shift 蹲下 | 跳上火车/汽车</div>
    <div id="dialog"></div>
    <div id="gameOver">
        <h1>游戏结束</h1>
        <p>最终分数：<span id="final">0</span></p>
        <button id="restart" onclick="restart()">再来一局</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
let scene, camera, renderer;
let player, trackGroup, obstacleGroup, propGroup;
let clock = new THREE.Clock();
let score = 0;
let gameSpeed = 65;
let gameOver = false;
let cutscene = true;
let dialogCooldown = false;

const targetDelta = 1/60;
let accumulator = 0;

const playerState = {
    lane:1, targetX:0, x:0, yVel:0,
    isJump:false, isCrouch:false,
    gravity:-0.035, jumpPower:0.65,
    onPlatform:false, platformY:0
};

const laneWidth = 4.8;
const segLen = 30;
let tracks = [], obstacles = [], props = [];

let weatherTime = 0;
let fogDensity = 0.004;

const openingLine = {
    name: "Dream",
    text: "I owed PigGod 100,000 dollars, I have no money, haven't paid for 91 days. If I beat Ender Dragon, I don't need to pay back."
};

const randomLines = [
    { name: "PigGod", text: "Dream！还我十万美刀！" },
    { name: "PigGod", text: "Dream, give me back my 100,000 dollars!" },
    { name: "PigGod", text: "I'm very angry！You die die die！" },
    { name: "PigGod", text: "I see you Dream！" },
    { name: "PigGod", text: "You cheat！看我开启black客！" },
    { name: "PigGod", text: "Come here loser！" },
    { name: "Dream", text: "I no money, no kill me！" },
    { name: "Dream", text: "Give you irons, don't kill me okay？" },
    { name: "Dream", text: "I还你十万美刀！" },
    { name: "Dream", text: "I错了，I错了！" },
    { name: "Dream", text: "PigGod come on catch me！" },
    { name: "Dream", text: "Oh no！PigGod要追上来了，我们快逃逸！" }
];

function showDialog(line) {
    if (dialogCooldown) return;
    const d = document.getElementById("dialog");
    d.innerHTML = `<b>${line.name}：</b>${line.text}`;
    d.style.display = "block";
    dialogCooldown = true;
    setTimeout(() => {
        d.style.display = "none";
        setTimeout(() => { dialogCooldown = false; }, 2000);
    }, 2400);
}

function playRandomLine() {
    if (gameOver || cutscene) return;
    const line = randomLines[Math.floor(Math.random() * randomLines.length)];
    showDialog(line);
    setTimeout(playRandomLine, Math.random() * 5000 + 6000);
}

function init() {
    scene = new THREE.Scene();
    updateWeather();

    camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
    camera.position.set(0, 12, -32);

    renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xfff6d8, 1.1);
    sun.position.set(12, 28, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    trackGroup = new THREE.Group();
    obstacleGroup = new THREE.Group();
    propGroup = new THREE.Group();
    scene.add(trackGroup, obstacleGroup, propGroup);

    createPlayer();
    buildTracks();
    startOpening();
    bindKeys();
    animate();
}

// 玩家模型放大+修复镂空BUG
function createPlayer() {
    player = new THREE.Group();
    player.position.y = 1.2;
    scene.add(player);

    const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 1.4, 0.6),
        new THREE.MeshLambertMaterial({ color: 0x2e86de })
    );
    body.position.y = 0.7;
    body.castShadow = true;
    player.add(body);

    const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.42, 12, 10),
        new THREE.MeshLambertMaterial({ color: 0xfad39e })
    );
    head.position.y = 1.5;
    player.add(head);

    const hat = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 0.24, 8),
        new THREE.MeshLambertMaterial({ color: 0xe74c3c })
    );
    hat.position.y = 1.75;
    player.add(hat);
}

// 障碍物放大
function makeHighBarrier(z) {
    const g = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.3,2.4), new THREE.MeshLambertMaterial({color:0x7f8c8d}));
    base.position.y = 0.15;
    g.add(base);

    const l = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,2.0,8), new THREE.MeshLambertMaterial({color:0xbdc3c7}));
    l.position.set(-0.9, 1.0, 0);
    g.add(l);
    const r = l.clone(); r.position.x = 0.9; g.add(r);

    const rail = new THREE.Mesh(new THREE.BoxGeometry(2.1,0.25,0.25), new THREE.MeshLambertMaterial({color:0xe67e22}));
    rail.position.y = 1.9;
    g.add(rail);

    g.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0, z);
    g.userData.isLow = false;
    return g;
}

function makeLowBarrier(z) {
    const g = new THREE.Group();
    const box = new THREE.Mesh(new THREE.BoxGeometry(2.7,0.7,2.7), new THREE.MeshLambertMaterial({color:0x27ae60}));
    box.position.y = 0.35;
    g.add(box);

    const line = new THREE.Mesh(new THREE.BoxGeometry(3.0,0.2,0.25), new THREE.MeshLambertMaterial({color:0xffffff}));
    line.position.y = 0.5;
    g.add(line);

    g.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0, z);
    g.userData.isLow = true;
    return g;
}

// 火车汽车放大
function makeTrain(z) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(4.5,2.1,12), new THREE.MeshLambertMaterial({color:0x2c3e50}));
    body.position.y = 1.05;
    g.add(body);
    const win = new THREE.Mesh(new THREE.BoxGeometry(4.0,0.8,10.5), new THREE.MeshLambertMaterial({color:0xb3cce5}));
    win.position.y = 1.2;
    g.add(win);
    g.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0, z);
    g.userData.vehicle = true;
    g.userData.py = 2.1;
    return g;
}

function makeCar(z) {
    const g = new THREE.Group();
    const b = new THREE.Mesh(new THREE.BoxGeometry(2.0,1.1,3.6), new THREE.MeshLambertMaterial({color:0xe74c3c}));
    b.position.y = 0.55;
    g.add(b);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.5,2.4), new THREE.MeshLambertMaterial({color:0x111111}));
    roof.position.y = 1.1;
    g.add(roof);
    g.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0, z);
    g.userData.vehicle = true;
    g.userData.py = 1.1;
    return g;
}

function makeBus(z) {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(2.7,2.0,6), new THREE.MeshLambertMaterial({color:0xf1c40f}));
    body.position.y = 1.0;
    g.add(body);
    const win = new THREE.Mesh(new THREE.BoxGeometry(2.4,1.4,5.0), new THREE.MeshLambertMaterial({color:0xb3cce5}));
    win.position.y = 1.1;
    g.add(win);
    g.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0, z);
    g.userData.vehicle = true;
    g.userData.py = 2.0;
    return g;
}

function makeBlock(z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(1.8,1.1,1.8), new THREE.MeshLambertMaterial({color:0x95a5a6}));
    m.position.set((Math.floor(Math.random()*3)-1)*laneWidth, 0.55, z);
    m.userData.vehicle = true;
    m.userData.py = 1.1;
    return m;
}

function makeLight(z) {
    const g = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,4.5,8), new THREE.MeshLambertMaterial({color:0x34495e}));
    pole.position.y = 2.25;
    g.add(pole);
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.25,6,4), new THREE.MeshLambertMaterial({color:0xf1c40f}));
    lamp.position.set(0, 3.8, 1.0);
    g.add(lamp);
    g.position.x = Math.random()>0.5 ? 10 : -10;
    g.position.z = z;
    return g;
}

const propTypes = [makeTrain, makeCar, makeBus, makeBlock, makeLight];

function spawnObs() {
    if (gameOver) return;
    const z = player.position.z + 55 + Math.random()*25;
    const o = Math.random()>0.5 ? makeHighBarrier(z) : makeLowBarrier(z);
    obstacleGroup.add(o);
    obstacles.push(o);
    setTimeout(spawnObs, Math.random()*180 + 80);
}

function spawnProp() {
    if (gameOver) return;
    const z = player.position.z + 85 + Math.random()*35;
    const fn = propTypes[Math.floor(Math.random()*propTypes.length)];
    const p = fn(z);
    propGroup.add(p);
    props.push(p);
    setTimeout(spawnProp, Math.random()*200 + 100);
}

function startOpening() {
    const d = document.getElementById("dialog");
    d.style.display = "block";
    showDialog(openingLine);
    setTimeout(() => {
        cutscene = false;
        d.style.display = "none";
        spawnObs();
        spawnProp();
        playRandomLine();
    }, 4000);
}

function updateWeather() {
    weatherTime += 0.004;
    fogDensity = 0.003 + Math.sin(weatherTime) * 0.0012;
    scene.fog = new THREE.FogExp2(0x87CEEB, fogDensity);
}

function bindKeys() {
    addEventListener("keydown", e => {
        if (cutscene) return;
        if ((e.code == "Space" || e.code == "ArrowUp") && !playerState.isJump) {
            playerState.isJump = true;
            playerState.yVel = playerState.jumpPower;
            playerState.onPlatform = false;
        }
        if ((e.code == "KeyD" || e.code == "ArrowRight") && playerState.lane > 0) {
            playerState.lane--;
            playerState.targetX = (playerState.lane - 1) * laneWidth;
        }
        if ((e.code == "KeyA" || e.code == "ArrowLeft") && playerState.lane < 2) {
            playerState.lane++;
            playerState.targetX = (playerState.lane - 1) * laneWidth;
        }
        if (e.code == "ShiftLeft") {
            playerState.isCrouch = true;
        }
    });
    addEventListener("keyup", e => {
        if (e.code == "ShiftLeft") playerState.isCrouch = false;
    });
}

function checkHit(a, b) {
    a.updateMatrixWorld(true);
    b.updateMatrixWorld(true);
    const ba = new THREE.Box3().setFromObject(a);
    const bb = new THREE.Box3().setFromObject(b);
    return ba.intersectsBox(bb);
}

function checkPlatform() {
    playerState.onPlatform = false;
    playerState.platformY = 0;
    const pb = new THREE.Box3().setFromObject(player);
    const bottomY = pb.min.y;

    for (const o of props) {
        if (!o.userData.vehicle) continue;
        o.updateMatrixWorld(true);
        const ob = new THREE.Box3().setFromObject(o);
        if (pb.intersectsBox(ob)) {
            if (bottomY >= ob.max.y - 0.4) {
                playerState.onPlatform = true;
                playerState.platformY = o.userData.py;
                player.position.y = playerState.platformY + 1.2;
                playerState.isJump = false;
                playerState.yVel = 0;
            } else {
                gameOver = true;
                document.getElementById("final").textContent = Math.floor(score);
                document.getElementById("gameOver").style.display = "block";
            }
        }
    }
}

// 道路放大加宽
function makeTrack(z) {
    const g = new THREE.Group();
    const road = new THREE.Mesh(new THREE.BoxGeometry(laneWidth*3, 0.6, segLen), new THREE.MeshLambertMaterial({color:0x444444}));
    road.position.y = -0.3;
    road.receiveShadow = true;
    g.add(road);

    const lineMat = new THREE.MeshBasicMaterial({color:0xffffff});
    for (let i = -1; i <= 1; i += 2) {
        const line = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.08,segLen), lineMat);
        line.position.x = i * laneWidth/2;
        g.add(line);
    }

    g.position.z = z;
    trackGroup.add(g);
    tracks.push(g);
}

function buildTracks() {
    for (let i = 0; i < 14; i++) makeTrack(i * segLen);
}

function update(delta) {
    if (cutscene || gameOver) return;

    updateWeather();
    score += delta * 18;
    document.getElementById("score").textContent = Math.floor(score);
    gameSpeed += delta * 0.18;

    tracks.forEach(t => {
        t.position.z -= gameSpeed * delta;
        if (t.position.z < player.position.z - 120) t.position.z += 420;
    });

    obstacles.forEach((o, i) => {
        o.position.z -= gameSpeed * delta;
        let h = false;
        if (!o.userData.isLow) h = checkHit(player, o);
        else if (!playerState.isCrouch) h = checkHit(player, o);
        if (h) {
            gameOver = true;
            document.getElementById("final").textContent = Math.floor(score);
            document.getElementById("gameOver").style.display = "block";
        }
        if (o.position.z < player.position.z - 60) {
            obstacleGroup.remove(o);
            obstacles.splice(i, 1);
        }
    });

    props.forEach((p, i) => {
        p.position.z -= gameSpeed * delta;
        if (p.position.z < player.position.z - 90) {
            propGroup.remove(p);
            props.splice(i, 1);
        }
    });

    checkPlatform();

    playerState.x += (playerState.targetX - playerState.x) * 0.3;
    player.position.x = playerState.x;

    player.scale.y = playerState.isCrouch ? 0.45 : 1;

    if (!playerState.onPlatform) {
        playerState.yVel += playerState.gravity;
        player.position.y += playerState.yVel;
        if (player.position.y <= 1.2) {
            player.position.y = 1.2;
            playerState.yVel = 0;
            playerState.isJump = false;
        }
    }

    camera.position.x += (player.position.x - camera.position.x) * 0.12;
    camera.position.z = player.position.z - 20;
    camera.lookAt(player.position.x, 2.4, player.position.z);
}

function restart() {
    obstacles.forEach(o => obstacleGroup.remove(o));
    props.forEach(p => propGroup.remove(p));
    obstacles = [];
    props = [];

    player.position.set(0, 1.2, 0);
    player.scale.set(1, 1, 1);
    playerState.lane = 1;
    playerState.targetX = 0;
    playerState.x = 0;
    playerState.yVel = 0;
    playerState.isJump = false;
    playerState.isCrouch = false;
    playerState.onPlatform = false;

    score = 0;
    gameSpeed = 65;
    gameOver = false;
    document.getElementById("score").textContent = "0";
    document.getElementById("gameOver").style.display = "none";
    spawnObs();
    spawnProp();
}

function animate() {
    requestAnimationFrame(animate);
    let delta = Math.min(clock.getDelta(), 0.1);
    accumulator += delta;

    while (accumulator >= targetDelta) {
        update(targetDelta);
        accumulator -= targetDelta;
    }

    renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
