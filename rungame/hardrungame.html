<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 无尽跑酷游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; font-family: Arial, sans-serif; }
        #gameCanvas { display: block; background: #87CEEB; }
        #ui {
            position: absolute; top: 20px; left: 20px; color: #fff;
            font-size: 28px; text-shadow: 2px 2px 4px #000; z-index: 10;
        }
        #tip {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000;
        }
        #gameOver {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.7); padding: 40px; border-radius: 12px;
            color: white; text-align: center; display: none; z-index: 20;
        }
        #rankBtn {
            position: absolute; top: 20px; right: 20px; z-index: 10;
            padding: 10px 20px; font-size: 16px;
            background: #ff9800; color: #fff; border: none; border-radius: 6px;
            cursor: pointer;
        }
        #rankPanel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85); padding: 30px; border-radius: 12px;
            color: white; width: 460px; max-height: 80vh; overflow-y: auto;
            display: none; z-index: 30;
        }
        #rankPanel h2 { margin-bottom: 20px; text-align: center; color: #ffd700; }
        .rank-item {
            display: flex; justify-content: space-between;
            padding: 8px 10px; border-bottom: 1px solid #555; font-size: 18px;
        }
        .rank-top3 { color: #ffd700; font-weight: bold; }
        .rank-input-wrap {
            margin-top: 15px; display: flex; gap: 8px;
        }
        #nickInput {
            flex: 1; padding: 8px; font-size: 16px; border-radius: 4px; border: none;
        }
        .file-btns {
            display: flex; gap: 10px; margin: 15px 0;
        }
        .file-btn {
            flex: 1; padding: 8px; font-size: 14px; border: none; border-radius: 4px;
            cursor: pointer; background: #03a9f4; color: white;
        }
        .close-btn {
            margin-top: 15px; width: 100%;
            padding: 10px; font-size: 16px; background: #666; border: none; color: #fff; border-radius: 6px;
            cursor: pointer;
        }
        button {
            margin-top: 20px; padding: 12px 30px; font-size: 18px;
            cursor: pointer; background: #2196F3; color: white; border: none; border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="ui">分数：<span id="score">0</span></div>
    <button id="rankBtn" onclick="openRankPanel()">排行榜</button>
    <div id="tip">操作：A/D ←→换道 | 空格/上跳跃 | 左Shift蹲下</div>

    <div id="gameOver">
        <h1>游戏结束</h1>
        <p>最终分数：<span id="finalScore">0</span></p>
        <div class="rank-input-wrap">
            <input id="nickInput" placeholder="输入昵称保存成绩" maxlength="10">
            <button onclick="saveScoreToPHP()" style="margin-top:0;">提交成绩</button>
        </div>
        <button onclick="restartGame()">重新开始</button>
    </div>

    <div id="rankPanel">
        <h2>🏆 最高分排行榜 TOP10</h2>
        <div id="rankList"></div>
        <button class="close-btn" onclick="closeRankPanel()">关闭</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // PHP接口地址，和html同目录无需修改
    const API_URL = "rank.php";

    let scene, camera, renderer, controls;
    let player, trackGroup, obstacleGroup;
    let clock = new THREE.Clock();
    let score = 0;
    let gameSpeed = 40;
    let gameOver = false;

    // 60帧锁帧
    const targetFPS = 60;
    const frameInterval = 1000 / targetFPS;
    let lastFrameTime = 0;

    const playerState = {
        lane: 1,
        targetX: 0,
        yVel: 0,
        isJump: false,
        isCrouch: false,
        gravity: -0.022,
        jumpPower: 0.45,
        normalScale: 1,
        crouchScale: 0.4
    };
    const laneWidth = 3.2;
    const trackSegmentLength = 25;
    let trackSegments = [];
    let obstacleList = [];

    // ---------------------- PHP后端请求函数 ----------------------
    // 提交分数保存到服务器文件
    async function saveScoreToPHP() {
        const nick = document.getElementById("nickInput").value.trim();
        const finalScore = Math.floor(score);
        if (!nick) {
            alert("请输入昵称！");
            return;
        }
        const formData = new FormData();
        formData.append("nick", nick);
        formData.append("score", finalScore);

        try {
            const res = await fetch(`${API_URL}?act=save`, {
                method: "POST",
                body: formData
            });
            const json = await res.json();
            if (json.code === 1) {
                alert("成绩保存成功！");
                document.getElementById("nickInput").value = "";
            } else {
                alert(json.msg);
            }
        } catch (err) {
            alert("服务器连接失败，请检查PHP环境");
            console.error(err);
        }
    }

    // 打开并加载排行榜
    async function openRankPanel() {
        const panel = document.getElementById("rankPanel");
        const listWrap = document.getElementById("rankList");
        listWrap.innerHTML = "加载中...";
        try {
            const res = await fetch(`${API_URL}?act=get`);
            const json = await res.json();
            listWrap.innerHTML = "";
            if (json.data.length === 0) {
                listWrap.innerHTML = "<p style='text-align:center;padding:20px;'>暂无任何游戏记录</p>";
            } else {
                json.data.forEach((item, index) => {
                    const div = document.createElement("div");
                    div.className = "rank-item" + (index < 3 ? " rank-top3" : "");
                    div.innerHTML = `
                        <span>${index + 1}. ${item.nick}</span>
                        <span>${item.score} 分</span>
                    `;
                    listWrap.appendChild(div);
                });
            }
        } catch (err) {
            listWrap.innerHTML = "<p style='color:red;text-align:center;'>加载失败，无法连接后端</p>";
            console.error(err);
        }
        panel.style.display = "block";
    }

    function closeRankPanel() {
        document.getElementById("rankPanel").style.display = "none";
    }
    // ------------------------------------------------------------

    function init() {
        scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x87CEEB, 30, 120);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 6, -12);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        renderer.domElement.id = "gameCanvas";

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        trackGroup = new THREE.Group();
        obstacleGroup = new THREE.Group();
        scene.add(trackGroup, obstacleGroup);

        createPlayer();
        createInitialTrack();
        spawnObstacle();
        window.addEventListener("resize", onWindowResize);
        bindKeys();
        animate();
    }

    function createPlayer() {
        const geo = new THREE.BoxGeometry(1, 1.6, 1);
        const mat = new THREE.MeshLambertMaterial({ color: 0xff4444 });
        player = new THREE.Mesh(geo, mat);
        player.position.set(0, 0.8, 0);
        player.castShadow = true;
        scene.add(player);
    }

    function createTrackSegment(zPos) {
        const segGroup = new THREE.Group();
        const roadGeo = new THREE.BoxGeometry(laneWidth * 3, 0.4, trackSegmentLength);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.position.y = -0.2;
        road.receiveShadow = true;
        segGroup.add(road);

        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = -1; i <= 1; i += 2) {
            const lineGeo = new THREE.BoxGeometry(0.15, 0.05, trackSegmentLength);
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.position.set(i * laneWidth / 2, 0, 0);
            segGroup.add(line);
        }

        const grassGeo = new THREE.BoxGeometry(6, 0.35, trackSegmentLength);
        const grassMat = new THREE.MeshLambertMaterial({ color: 0x33aa33 });
        const grassL = new THREE.Mesh(grassGeo, grassMat);
        grassL.position.set(-(laneWidth * 3) / 2 - 3, -0.32, 0);
        const grassR = grassL.clone();
        grassR.position.set((laneWidth * 3) / 2 + 3, -0.32, 0);
        segGroup.add(grassL, grassR);

        segGroup.position.z = zPos;
        trackGroup.add(segGroup);
        trackSegments.push(segGroup);
    }

    function createInitialTrack() {
        for (let i = 0; i < 6; i++) {
            createTrackSegment(i * trackSegmentLength);
        }
    }

    function spawnObstacle() {
        if (gameOver) return;
        const laneIdx = Math.floor(Math.random() * 3);
        const x = (laneIdx - 1) * laneWidth;
        const z = player.position.z + 60 + Math.random() * 40;

        const isLow = Math.random() > 0.5;
        let obsGeo, obsMat;
        if (isLow) {
            obsGeo = new THREE.BoxGeometry(1.4, 0.7, 1.4);
            obsMat = new THREE.MeshLambertMaterial({ color: 0x22dd22 });
        } else {
            obsGeo = new THREE.BoxGeometry(1.4, 1.8, 1.4);
            obsMat = new THREE.MeshLambertMaterial({ color: 0x3333ff });
        }
        const obs = new THREE.Mesh(obsGeo, obsMat);
        obs.position.set(x, isLow ? 0.35 : 0.9, z);
        obs.userData.isLow = isLow;
        obs.castShadow = true;
        obstacleGroup.add(obs);
        obstacleList.push(obs);

        setTimeout(spawnObstacle, Math.random() * 500 + 100);
    }

    const keys = {};
    function bindKeys() {
        document.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (gameOver) return;
            if (e.code === "Space" || e.code === "ArrowUp") {
                if (!playerState.isJump) {
                    playerState.isJump = true;
                    playerState.yVel = playerState.jumpPower;
                }
            }
            if ((e.code === "KeyD" || e.code === "ArrowRight") && playerState.lane > 0) {
                playerState.lane--;
                playerState.targetX = (playerState.lane - 1) * laneWidth;
            }
            if ((e.code === "KeyA" || e.code === "ArrowLeft") && playerState.lane < 2) {
                playerState.lane++;
                playerState.targetX = (playerState.lane - 1) * laneWidth;
            }
            if (e.code === "ShiftLeft") {
                playerState.isCrouch = true;
            }
        });
        document.addEventListener("keyup", e => {
            keys[e.code] = false;
            if (e.code === "ShiftLeft") {
                playerState.isCrouch = false;
            }
        });
    }

    function checkCollision(meshA, meshB) {
        const boxA = new THREE.Box3().setFromObject(meshA);
        const boxB = new THREE.Box3().setFromObject(meshB);
        return boxA.intersectsBox(boxB);
    }

    function updateScore() {
        score += 0.1;
        document.getElementById("score").textContent = Math.floor(score);
    }

    function triggerGameOver() {
        gameOver = true;
        document.getElementById("finalScore").textContent = Math.floor(score);
        document.getElementById("gameOver").style.display = "block";
    }

    function restartGame() {
        obstacleList.forEach(obs => obstacleGroup.remove(obs));
        obstacleList = [];

        player.position.set(0, 0.8, 0);
        player.scale.set(1, 1, 1);
        playerState.lane = 1;
        playerState.targetX = 0;
        playerState.yVel = 0;
        playerState.isJump = false;
        playerState.isCrouch = false;
        score = 0;
        gameSpeed = 40;
        gameOver = false;
        document.getElementById("gameOver").style.display = "none";
        document.getElementById("score").textContent = "0";
        spawnObstacle();
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function updateGameLogic(delta) {
        if (!gameOver) {
            updateScore();
            gameSpeed += delta * 10;

            trackGroup.children.forEach(seg => {
                seg.position.z -= gameSpeed * delta;
                if (seg.position.z < player.position.z - trackSegmentLength * 3) {
                    seg.position.z += trackSegmentLength * 6;
                }
            });

            obstacleList.forEach(obs => {
                obs.position.z -= gameSpeed * delta;
                let hit = false;
                if (!obs.userData.isLow) {
                    hit = checkCollision(player, obs);
                } else if (obs.userData.isLow && !playerState.isCrouch) {
                    hit = checkCollision(player, obs);
                }
                if (hit) triggerGameOver();
                if (obs.position.z < player.position.z - 20) {
                    obstacleGroup.remove(obs);
                    const idx = obstacleList.indexOf(obs);
                    if (idx > -1) obstacleList.splice(idx, 1);
                }
            });

            const targetScaleY = playerState.isCrouch ? playerState.crouchScale : playerState.normalScale;
            player.scale.y += (targetScaleY - player.scale.y) * 0.12;
            player.position.y = playerState.isJump ? player.position.y : (playerState.isCrouch ? 0.35 : 0.8);

            player.position.x += (playerState.targetX - player.position.x) * 0.15;

            if (playerState.isJump) {
                playerState.yVel += playerState.gravity;
                player.position.y += playerState.yVel;
                if (player.position.y <= 0.8) {
                    player.position.y = 0.8;
                    playerState.yVel = 0;
                    playerState.isJump = false;
                }
            }

            camera.position.x += (player.position.x - camera.position.x) * 0.08;
            camera.position.z = player.position.z - 12;
            camera.lookAt(player.position.x, 1, player.position.z);
        }
    }

    function animate(timestamp) {
        requestAnimationFrame(animate);
        if (timestamp < lastFrameTime + frameInterval) return;
        lastFrameTime = timestamp;
        let delta = clock.getDelta();
        delta = Math.min(delta, 0.1);
        updateGameLogic(delta);
        renderer.render(scene, camera);
    }
    init();
</script>
</body>
</html>
